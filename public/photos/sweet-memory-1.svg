<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC0D9" />
      <stop offset="50%" stop-color="#FFD6E8" />
      <stop offset="100%" stop-color="#FFEBF3" />
    </linearGradient>
    <filter id="softGlow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#skyGrad1)" />
  <!-- Stars -->
  <circle cx="80" cy="50" r="3" fill="#FFF" opacity="0.8" />
  <circle cx="320" cy="70" r="4" fill="#FFD700" opacity="0.9" />
  <circle cx="210" cy="40" r="2.5" fill="#FFF" opacity="0.85" />
  <circle cx="140" cy="90" r="3" fill="#FFD700" opacity="0.7" />
  <!-- Crescent Moon -->
  <path d="M 310 40 A 25 25 0 0 0 330 80 A 20 20 0 1 1 310 40 Z" fill="#FFEAA7" opacity="0.9" />
  <!-- Soft Clouds -->
  <path d="M 40 180 Q 70 140 110 180 Q 150 140 190 180 Q 230 140 270 180 Q 300 220 240 220 L 40 220 Z" fill="#FFFFFF" opacity="0.65" />
  <!-- Romantic Floating Heart in Center -->
  <path d="M 200 130 C 200 110 180 95 160 110 C 140 125 140 150 170 180 L 200 210 L 230 180 C 260 150 260 125 240 110 C 220 95 200 110 200 130 Z" fill="#FF3F8E" filter="url(#softGlow1)" />
  <text x="200" y="255" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" fill="#54243B">
    Magical Starlit Moments ✨
  </text>
</svg>
